---
# Shared managed nodes for every Molecule scenario.
#
# The role does not touch networking, so the test matrix is not limited to
# the Debian/Ubuntu pair used by systemd-networkd roles. It covers both
# package-manager families the role implements:
#
#   Debian family  - Debian 13 (package install path) and Ubuntu 26.04
#   RedHat family  - Rocky Linux 10 and Fedora 44
#
# Only the latest release published by ak1ra-lab/docker-systemd is tested for
# each distribution. A distribution is included only if the Python bundled in
# its image satisfies the project's >=3.11 floor; do not add per-host
# interpreter overrides. SUSE and Arch Linux are supported by the role but
# docker-systemd does not publish images for them yet; add hosts here once it
# does.
#
# ansible_host is the container name the container connection plugin
# attaches to. Names are unique per project, but not per checkout: run one
# checkout at a time on a host, or destroy the default scenario before
# starting another checkout.
all:
  children:
    test_resources:
      hosts:
        debian-13:
          ansible_host: molecule-restic-profile-debian-13
          container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:13
          restic_profile_restic_install_source: package
        ubuntu-2604:
          ansible_host: molecule-restic-profile-ubuntu-2604
          container_image: ghcr.io/ak1ra-lab/docker-systemd/ubuntu:26.04
          restic_profile_restic_install_source: existing
        rocky-10:
          ansible_host: molecule-restic-profile-rocky-10
          container_image: ghcr.io/ak1ra-lab/docker-systemd/rocky:10
          restic_profile_restic_install_source: existing
        fedora-44:
          ansible_host: molecule-restic-profile-fedora-44
          container_image: ghcr.io/ak1ra-lab/docker-systemd/fedora:44
          restic_profile_restic_install_source: existing
