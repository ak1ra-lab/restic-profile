---
name: publish-to-pypi

on:
  workflow_dispatch: ~
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Run the complete reusable suite (Python tests, ansible-lint, Molecule)
  # before anything is uploaded.
  ci:
    permissions:
      contents: read
    # ./ is used instead of the newer $/ self-repository syntax because
    # actionlint 1.7.12 (latest at the time of writing) cannot parse $/ yet.
    uses: ./.github/workflows/ci.yaml

  build-n-push:
    name: upload release to PyPI
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/restic-profile/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install the project
        run: uv sync --locked --group dev

      - name: Build a binary wheel and a source tarball
        run: uv build -v

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
