---
name: ci

on:
  # Reusable entry point for publish-to-pypi and any future caller.
  workflow_call: ~
  workflow_dispatch: ~
  push:
    branches:
      - master
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --group dev

      - name: Lint and format check
        run: |
          uv run ruff check src/ tests/ plugins/
          uv run ruff format --check src/ tests/ plugins/

      - name: Type check
        run: uv run ty check src/ plugins/

      - name: Run tests
        run: uv run pytest -v tests/

      - name: Build documentation
        if: matrix.python-version == '3.13'
        run: NO_MKDOCS_2_WARNING=1 uv run mkdocs build --strict

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: Install the project
        run: uv sync --locked --group dev

      - name: Install the collection and scenario requirements
        run: |
          mkdir -p .ansible/collections
          uv run ansible-galaxy collection install --force --collections-path .ansible/collections .
          uv run ansible-galaxy collection install -r requirements.yaml -p .ansible/collections

      - name: Run ansible-lint
        run: uv run ansible-lint

  molecule:
    name: Molecule
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: Install the project
        run: uv sync --locked --group dev

      # Rootful Podman is required for the systemd containers (the same
      # recipe as ak1ra-lab/docker-systemd). The runner needs Python and uv
      # for Molecule and for the role's local wheel build.
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install the collection and scenario requirements
        run: |
          mkdir -p .ansible/collections
          uv run ansible-galaxy collection install --force --collections-path .ansible/collections .
          uv run ansible-galaxy collection install -r requirements.yaml -p .ansible/collections

      - name: Run the Molecule scenarios
        run: >-
          sudo env "PATH=${PWD}/.venv/bin:${PATH}"
          MOLECULE_GLOB='extensions/molecule/**/molecule.yml'
          molecule test --all
