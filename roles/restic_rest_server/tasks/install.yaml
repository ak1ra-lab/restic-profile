---
- name: update apt cache on Debian
  become: true
  when: ansible_facts.os_family == 'Debian'
  ansible.builtin.apt:
    update_cache: true

- name: install htpasswd Python dependencies
  become: true
  ansible.builtin.package:
    name: "{{ restic_rest_server_pkg_deps }}"
    state: present
  when: restic_rest_server_pkg_deps | length > 0

- name: install restic-rest-server via package manager
  when:
    - restic_rest_server_binary_install_source == 'package'
    - restic_rest_server_pkg_name | length > 0
  become: true
  ansible.builtin.package:
    name: "{{ restic_rest_server_pkg_name }}"
    state: present
  failed_when: false

- name: build restic-rest-server on control node
  when: restic_rest_server_binary_install_source == 'go_build'
  ansible.builtin.include_role:
    name: ak1ra_lab.general.go_build
    apply:
      become: false
  vars:
    go_build_repo_url: https://github.com/restic/rest-server.git
    go_build_repo_version: "{{ restic_rest_server_go_build_repo_version }}"
    go_build_package: .
    go_build_output_name: restic-rest-server
    go_build_goos: "{{ restic_rest_server_go_build_goos }}"
    go_build_goarch: "{{ restic_rest_server_go_build_goarch }}"
    go_build_static: "{{ restic_rest_server_go_build_static }}"
    go_build_ldflags: "{{ restic_rest_server_go_build_ldflags }}"

- name: install go_build restic-rest-server binary
  when: restic_rest_server_binary_install_source == 'go_build'
  become: true
  ansible.builtin.copy:
    src: "{{ go_build_binary_path }}"
    dest: "{{ restic_rest_server_binary_install_path }}"
    owner: root
    group: root
    mode: "0755"

- name: set restic-rest-server exec path
  ansible.builtin.set_fact:
    restic_rest_server_exec_path: >-
      {{ restic_rest_server_pkg_binary_path
         if restic_rest_server_binary_install_source == 'package'
         else restic_rest_server_binary_install_path }}

- name: check if restic-rest-server binary exists
  ansible.builtin.stat:
    path: "{{ restic_rest_server_exec_path }}"
  register: _restic_rest_server_bin

- name: set restic-rest-server available fact
  ansible.builtin.set_fact:
    restic_rest_server_available: "{{ _restic_rest_server_bin.stat.exists }}"
